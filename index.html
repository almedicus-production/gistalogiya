<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gistologiya Og'zaki Imtihon Platformasi | Almedicus</title>
  <meta name="description" content="Gistologiya, sitologiya va embriologiya fani og'zaki imtihoniga tayyorlanish platformasi: 111 ta savol, 85 ta masala, 51 ta preparat va sxemalar.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 2v20M2 12h20'/></svg>">
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18h8"></path>
            <path d="M3 22h18"></path>
            <path d="M14 22a7 7 0 1 0 0-14h-1"></path>
            <path d="M9 14h2"></path>
            <path d="M9 12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2"></path>
            <path d="M12 2v2"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="brandTitle">Gistologiya Imtihon Ekspert</h1>
          <p id="brandSubtitle">Tibbiyot OTMlari Og'zaki Imtihoniga To'liq Tayyorgarlik</p>
        </div>
      </a>

      <div class="header-controls">
        <span class="stats-pill" id="statsSummary">Yuklanmoqda...</span>

        <!-- Language / Script Switcher -->
        <div class="lang-switcher-wrap" id="langSwitcherWrap">
          <button class="btn-icon lang-btn" id="langDropdownBtn" title="Tilni tanlash / Выбор языка / Select Language">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span id="currentLangLabel">O'zbek</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="lang-dropdown-menu" id="langDropdownMenu">
            <button class="lang-option-btn active" data-lang="uz-lat">
              <span class="lang-flag">UZ</span>
              <span class="lang-name">O'zbekcha (Lotin)</span>
            </button>
            <button class="lang-option-btn" data-lang="uz-cyr">
              <span class="lang-flag">ЎЗ</span>
              <span class="lang-name">Ўзбекча (Кирилл)</span>
            </button>
            <button class="lang-option-btn" data-lang="ru">
              <span class="lang-flag">RU</span>
              <span class="lang-name">Русский</span>
            </button>
            <button class="lang-option-btn" data-lang="en">
              <span class="lang-flag">EN</span>
              <span class="lang-name">English</span>
            </button>
          </div>
        </div>

        <button class="btn-icon" id="headerProfileBtn" title="Shaxsiy Profil va Yutuqlar" style="width:auto; padding:0 12px; border-radius:20px; font-weight:700; gap:6px; font-size:0.85rem;">
          <span id="headerAvatar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <span id="headerScore" style="color:var(--primary); font-weight:800;">0</span>
        </button>
        <button class="btn-icon" id="themeToggleBtn" title="Mavzuni almashtirish">
          <svg id="themeIconSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs Bar -->
  <nav class="nav-tabs-wrapper">
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="questions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span class="tab-label" data-tab-key="tabQuestions">Nazariy Savollar</span>
        <span class="tab-badge" id="badgeQuestions">111</span>
      </button>
      <button class="tab-btn" data-tab="cases">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"></path></svg>
        <span class="tab-label" data-tab-key="tabCases">Vaziyatli Masalalar</span>
        <span class="tab-badge" id="badgeCases">85</span>
      </button>
      <button class="tab-btn" data-tab="preparations">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"></path><path d="M3 22h18"></path><path d="M14 22a7 7 0 1 0 0-14h-1"></path><path d="M9 14h2"></path><path d="M9 12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2"></path><path d="M12 2v2"></path></svg>
        <span class="tab-label" data-tab-key="tabPreparations">Mikroskopik Preparatlar</span>
        <span class="tab-badge" id="badgePreparations">51</span>
      </button>
      <button class="tab-btn" data-tab="schemes">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="tab-label" data-tab-key="tabSchemes">Sxemalar</span>
        <span class="tab-badge" id="badgeSchemes">5</span>
      </button>
      <button class="tab-btn" data-tab="simulator">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
        <span class="tab-label" data-tab-key="tabSimulator">Imtihon Biletlari</span>
        <span class="tab-badge" id="badgeSimulator" style="background:rgba(245,158,11,0.15); color:#d97706;">Bilet</span>
      </button>
      <button class="tab-btn" data-tab="profile">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span class="tab-label" data-tab-key="tabProfile">Profil & Yutuqlar</span>
        <span class="tab-badge" id="badgeProfileScore" style="background:rgba(16,185,129,0.15); color:#059669;">0 ball</span>
      </button>
      <button class="tab-btn" data-tab="favorites">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span class="tab-label" data-tab-key="tabFavorites">Sevimlilar</span>
        <span class="tab-badge" id="badgeFavorites">0</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Layout -->
  <main class="main-content">
    
    <!-- Filter and Search Bar -->
    <section class="search-filter-bar">
      <div class="search-input-group">
        <span class="search-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input 
          type="text" 
          id="mainSearchInput" 
          class="main-search-input" 
          placeholder="Savol, masala, preparat nomi yoki kalit so'zlarni qidiring..." 
        />
      </div>

      <div class="filter-actions">
        <div class="category-chips" id="categoryChips">
          <!-- Dynamically populated categories -->
        </div>

        <div class="view-toggles">
          <label class="toggle-switch-label">
            <input type="checkbox" id="hideAnswersToggle" style="cursor:pointer;" />
            <span id="hideAnswersLabel">Yodlash rejimi (Javoblarni yashirish)</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Dynamic Content Injection Area -->
    <section id="contentArea">
      <!-- Injected via JavaScript -->
    </section>

  </main>

  <!-- Floating Back to Top Button -->
  <button class="back-to-top-btn" id="backToTopBtn" title="Yuqoriga qaytish" aria-label="Yuqoriga qaytish">в†‘</button>

  <!-- Footer -->
  <footer style="text-align:center; padding:24px 20px; font-size:0.85rem; color:var(--text-muted); border-top:1px solid var(--border); background:var(--bg-card);">
    <p><b>Almedicus Medical Education Platform</b> &bull; Gistologiya, Sitologiya va Embriologiya kafedrasi rasmiy dasturi asosida</p>
    <p style="margin-top:4px;" id="footerWish">Og'zaki imtihonda a'lo baholar tilaymiz!</p>
  </footer>

  <!-- Scripts Loading Order -->
  <!-- 1. Questions data -->
  <script src="js/data_questions_part1.js"></script>
  <script src="js/data_questions_part2.js"></script>
  <script src="js/data_questions_part3.js"></script>
  <script src="js/data_questions_part4.js"></script>
  <script src="js/data_questions.js"></script>

  <!-- 2. Cases data -->
  <script src="js/data_cases_part1.js"></script>
  <script src="js/data_cases_part2.js"></script>
  <script src="js/data_cases_part3.js"></script>
  <script src="js/data_cases.js"></script>

  <!-- 3. Preparations data & embedded images -->
  <script src="js/data_atlas_info.js"></script>
  <script src="js/data_prep_part1.js"></script>
  <script src="js/data_prep_part2.js"></script>
  <script src="js/data_preparations.js"></script>
  <script src="js/data_prep_images.js"></script>

  <!-- 4. Schemes data -->
  <script src="js/data_schemes.js"></script>

  <!-- 5. Main Application Logic -->
  <script src="js/app.js"></script>

</body>
</html>
